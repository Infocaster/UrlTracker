mode: ContinuousDeployment
branches:
  feature:
    label: alpha
    regex: ^v16/feature/
    source-branches: [ 'develop' ]
  develop:
    label: beta
    regex: ^v16/develop$
  master:
    label: ''
    regex: ^v16/main$
  hotfix:
    label: 'beta'
    regex: ^v16/hotfix
    source-branches: [ 'master' ]
  release:
    label: 'rc'
    regex: ^v16/release
ignore:
  sha: [4d71999c318039694f207979521ed25574bf6176]