mode: ContinuousDeployment
branches:
  feature:
    label: alpha
    regex: ^v18/feature/
    source-branches: [ 'develop' ]
  develop:
    label: beta
    regex: ^v18/develop$
  master:
    label: ''
    regex: ^v18/main$
  hotfix:
    label: 'beta'
    regex: ^v18/hotfix
    source-branches: [ 'master' ]
  release:
    label: 'rc'
    regex: ^v18/release
ignore:
  sha: []